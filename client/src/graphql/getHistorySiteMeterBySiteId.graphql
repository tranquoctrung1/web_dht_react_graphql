query GetHistoryMeterBySiteId($siteid: String) {
    GetHistoryMeterBySiteId(siteid: $siteid) {
        DateChanged
        Description
        NewMeterIndex
        NewMeterSerial
        NewMeterMarks
        NewMeterSize
        NewMeterModel
        OldMeterIndex
        OldMeterSerial
        SiteId
        _id
    }
}
