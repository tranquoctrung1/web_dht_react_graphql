query GetHistoryMeterByMeter($meterSerial: String) {
    GetHistoryMeterByMeter(meterSerial: $meterSerial) {
        DateChanged
        Description
        NewMeterIndex
        NewMeterSerial
        NewMeterMarks
        NewMeterSize
        NewMeterModel
        OldMeterIndex
        OldMeterSerial
        SiteId
        _id
    }
}
